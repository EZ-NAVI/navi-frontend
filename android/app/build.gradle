apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply from: project(":react-native-config").projectDir.getPath() + "/dotenv.gradle"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    namespace "com.navi"
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.navi"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        // 백그라운드 위치 권한 필요시 자동 추가 (Android 10 이상)
        manifestPlaceholders = [
                useLegacyStorage: false
        ]
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    /**
     * Kotlin + Java 경로 포함시키기
     */
    sourceSets {
        main {
            java.srcDirs = [
                    'src/main/java',
                    'src/main/kotlin'
            ]
        }
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean())
        implementation("com.facebook.react:hermes-android")
    else
        implementation jscFlavor

    // ⭐ FusedLocationProviderClient (GPS)
    implementation "com.google.android.gms:play-services-location:21.0.1"

    // ⭐ TMap SDK (AAR)
    implementation files('libs/tmap-sdk-3.0.aar')
    implementation(name: 'vsm-tmap-sdk-v2-android-1.7.45', ext: 'aar')

    implementation 'com.google.android.material:material:1.9.0'
}

apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"

project.ext.react = [
        newArchEnabled: false
]
