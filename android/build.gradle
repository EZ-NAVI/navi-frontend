buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 24
        compileSdkVersion = 34
        targetSdkVersion = 34
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.24"

        // 🔥 Google Play Services 버전 강제 통일
        playServicesLocationVersion = "21.0.1"
    }

    repositories {
        google()
        mavenCentral()
        maven { url "$rootDir/../node_modules/react-native-config/android" }
    }

    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath files("../node_modules/react-native-config/android/react-native-config.gradle")
    }
}

apply plugin: "com.facebook.react.rootproject"

/**
 * 🔥 모든 서브모듈에서 Google Play Services Location 버전 강제 적용
 * (Gradle 8에서도 안전하게 작동)
 */
configurations.all {
    resolutionStrategy {
        force "com.google.android.gms:play-services-location:${playServicesLocationVersion}"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url "https://repo.tmapapi.sktelecom.com/repository/tmap-sdk-release/"
            allowInsecureProtocol = true
        }
    }
}
